<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zenith — Symbiote Edition</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #000000;
      --panel: rgba(12, 12, 14, 0.85);
      --border: rgba(255, 255, 255, 0.15);
      --border-strong: rgba(255, 255, 255, 0.35);
      --text: #ffffff;
      --text-dim: #9ca3af;
      --bot-bg: rgba(18, 18, 22, 0.75);
      --user-bg: rgba(255, 255, 255, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background-color: #000000;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(255, 255, 255, 0.09) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(30, 30, 35, 0.35) 0%, #000000 75%);
      background-size: cover;
      background-position: center;
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    .spider-bg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 210px;
      height: 270px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.28;
      filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.25));
    }

    header {
      background: var(--panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 11px; }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: radial-gradient(circle at center, #1f1f24 0%, #000000 100%);
      border: 1px solid rgba(255, 255, 255, 0.35);
      display: grid;
      place-items: center;
      overflow: hidden;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.22);
      background-size: cover;
      background-position: center;
      cursor: pointer;
    }
    .avatar svg {
      width: 26px;
      height: 30px;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.5));
    }

    .status { font-size: 11px; color: #e5e7eb; font-weight: 600; display: flex; align-items: center; gap: 5px; }
    .status::before {
      content: '';
      width: 6px;
      height: 6px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px #ffffff;
    }

    .icon-btn {
      background: radial-gradient(circle at center, #1f1f24 0%, #000000 100%);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.25);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
    }
    .icon-btn:active { transform: scale(0.92); border-color: #ffffff; }

    #settingsPanel {
      display: none;
      background: rgba(10, 10, 12, 0.96);
      backdrop-filter: blur(16px);
      padding: 16px;
      border-bottom: 1px solid var(--border);
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }
    #settingsPanel.open { display: flex; }
    .settings-row { display: flex; gap: 8px; }
    .settings-row input, .settings-row textarea {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #000000;
      color: #ffffff;
      font-size: 13px;
      outline: none;
    }
    .settings-row textarea {
      min-height: 66px;
      resize: vertical;
      line-height: 1.4;
    }
    .settings-row input:focus, .settings-row textarea:focus { border-color: #ffffff; }
    .action-pill {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid var(--border);
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex: 1;
    }
    .action-pill:active { background: rgba(255, 255, 255, 0.2); }

    #chat {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 13px;
      z-index: 1;
      scroll-behavior: smooth;
    }
    .msg {
      max-width: 84%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 15px;
      word-wrap: break-word;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      animation: popIn 0.25s ease;
    }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .user {
      background: var(--user-bg);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      border: 1px solid var(--border-strong);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .bot {
      background: var(--bot-bg);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border);
      color: #f3f4f6;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .action-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 9px 14px;
      background: #ffffff;
      color: #000000;
      font-weight: 700;
      text-decoration: none;
      border-radius: 10px;
      font-size: 13px;
    }

    form {
      display: flex;
      gap: 9px;
      padding: 11px 14px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      align-items: center;
      z-index: 10;
    }
    #input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      outline: none;
      font-size: 15px;
    }
    #input:focus { border-color: var(--border-strong); }

    .mic-btn {
      background: radial-gradient(circle at center, #1f1f24 0%, #000000 100%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
      transition: all 0.2s;
    }
    .mic-btn svg {
      width: 20px;
      height: 20px;
      stroke: #ffffff;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .mic-btn.listening { background: #ef4444; border-color: #ef4444; box-shadow: 0 0 16px #ef4444; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

    #sendBtn {
      padding: 12px 18px;
      border-radius: 22px;
      border: none;
      background: linear-gradient(135deg, #ffffff 0%, #d1d5db 100%);
      color: #000000;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.25);
    }
    #sendBtn:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <svg class="spider-bg" id="spiderWatermark" viewBox="0 0 200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="50%" stop-color="#9ca3af" />
        <stop offset="100%" stop-color="#ffffff" />
      </linearGradient>
    </defs>
    <path d="M100 72 C92 72 88 82 91 92 C84 100 84 125 100 142 C116 125 116 100 109 92 C112 82 108 72 100 72 Z" fill="url(#chrome)"/>
    <path d="M91 88 L58 65 L66 22 L52 68 L89 94 Z" fill="url(#chrome)"/>
    <path d="M109 88 L142 65 L134 22 L148 68 L111 94 Z" fill="url(#chrome)"/>
    <path d="M89 96 L46 82 L44 35 L38 86 L88 102 Z" fill="url(#chrome)"/>
    <path d="M111 96 L154 82 L156 35 L162 86 L112 102 Z" fill="url(#chrome)"/>
    <path d="M88 106 L36 122 L42 205 L28 118 L89 112 Z" fill="url(#chrome)"/>
    <path d="M112 106 L164 122 L158 205 L172 118 L111 112 Z" fill="url(#chrome)"/>
    <path d="M91 116 L58 142 L68 238 L50 138 L93 122 Z" fill="url(#chrome)"/>
    <path d="M109 116 L142 142 L132 238 L150 138 L107 122 Z" fill="url(#chrome)"/>
  </svg>

  <header>
    <div class="brand">
      <div class="avatar" id="zenithAvatar" title="Tap to set custom PFP">
        <svg id="avatarSpiderIcon" viewBox="0 0 200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M100 72 C92 72 88 82 91 92 C84 100 84 125 100 142 C116 125 116 100 109 92 C112 82 108 72 100 72 Z" fill="#ffffff"/>
          <path d="M91 88 L58 65 L66 22 L52 68 L89 94 Z" fill="#ffffff"/>
          <path d="M109 88 L142 65 L134 22 L148 68 L111 94 Z" fill="#ffffff"/>
          <path d="M89 96 L46 82 L44 35 L38 86 L88 102 Z" fill="#ffffff"/>
          <path d="M111 96 L154 82 L156 35 L162 86 L112 102 Z" fill="#ffffff"/>
          <path d="M88 106 L36 122 L42 205 L28 118 L89 112 Z" fill="#ffffff"/>
          <path d="M112 106 L164 122 L158 205 L172 118 L111 112 Z" fill="url(#chrome)"/>
          <path d="M91 116 L58 142 L68 238 L50 138 L93 122 Z" fill="#ffffff"/>
          <path d="M109 116 L142 142 L132 238 L150 138 L107 122 Z" fill="#ffffff"/>
        </svg>
      </div>
      <div>
        <div style="font-weight: 800; font-size: 16px; letter-spacing: 0.8px;">ZENITH</div>
        <div class="status" id="statusText">Connected</div>
      </div>
    </div>
    <button class="icon-btn" id="settingsToggle" title="Menu">:</button>
    <input type="file" id="bgPicker" accept="image/*" style="display:none;" />
    <input type="file" id="pfpPicker" accept="image/*" style="display:none;" />
  </header>

  <div id="settingsPanel">
    <div style="font-size: 13px; color: var(--text-dim);">Gemini API Key:</div>
    <div class="settings-row">
      <input type="password" id="apiKeyInput" placeholder="Paste key here..." />
      <button class="action-pill" id="saveKeyBtn" style="background: #ffffff; color: #000000; font-weight: 800; flex: 0.4;">Save</button>
    </div>
    <div style="font-size: 13px; color: var(--text-dim);">Saved Memory (Intro, Pronunciation & Facts):</div>
    <div class="settings-row">
      <textarea id="memoryInput" placeholder="Add things Zenith should always remember..."></textarea>
      <button class="action-pill" id="saveMemoryBtn" style="background: #ffffff; color: #000000; font-weight: 800; flex: 0.4;">Save</button>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="action-pill" id="bgBtn">Wallpaper</button>
      <button class="action-pill" id="speakSelectedBtn" style="background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.4); color: #38bdf8;">Read Highlighted</button>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="action-pill" id="resetBgBtn">Reset Theme</button>
      <button class="action-pill" id="clearChatBtn" style="color: #f87171;">Clear Chat</button>
    </div>
  </div>

  <div id="chat"></div>

  <form id="form">
    <input id="input" type="text" placeholder="Type '/ff', 'wa: ...', or ask Zenith..." autocomplete="off" required />
    <button type="button" id="micBtn" class="mic-btn" title="Voice Input">
      <svg viewBox="0 0 24 24">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>
    <button type="submit" id="sendBtn">Send</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const settingsPanel = document.getElementById('settingsPanel');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const memoryInput = document.getElementById('memoryInput');
    const bgBtn = document.getElementById('bgBtn');
    const bgPicker = document.getElementById('bgPicker');
    const pfpPicker = document.getElementById('pfpPicker');
    const zenithAvatar = document.getElementById('zenithAvatar');
    const avatarSpiderIcon = document.getElementById('avatarSpiderIcon');
    const spiderWatermark = document.getElementById('spiderWatermark');
    const micBtn = document.getElementById('micBtn');
    const speakSelectedBtn = document.getElementById('speakSelectedBtn');

    const DEFAULT_MEMORY = [
      "User's name is Shibasish.",
      "Pronounce Shibasish as 'Shiba-sish', never 'shibe shish'. When writing phonetic pronunciation or speaking aloud, spell it 'Shiba-sish'.",
      "Introduce yourself clearly as Zenith whenever asked to introduce yourself or greet."
    ].join('\n');

    let apiKey = localStorage.getItem('zenith_api_key') || '';
    let savedMemory = localStorage.getItem('zenith_memory');
    if (savedMemory === null) {
      savedMemory = DEFAULT_MEMORY;
      localStorage.setItem('zenith_memory', savedMemory);
    }
    let history = JSON.parse(localStorage.getItem('zenith_history') || '[]');
    let customBg = localStorage.getItem('zenith_bg') || '';
    let customPfp = localStorage.getItem('zenith_pfp') || '';

    apiKeyInput.value = apiKey;
    memoryInput.value = savedMemory;

    function stripHtml(str) {
      return String(str || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]*>/g, '').trim();
    }

    function normalizeForSpeech(text) {
      return stripHtml(text).replace(/\bshibasish\b/gi, 'Shiba-sish');
    }

    function applyBackground(imgData) {
      if (imgData) {
        document.body.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.55)), url(${imgData})`;
        spiderWatermark.style.display = 'none';
      } else {
        document.body.style.backgroundImage = '';
        spiderWatermark.style.display = 'block';
      }
    }

    function applyPfp(imgData) {
      if (imgData) {
        zenithAvatar.style.backgroundImage = `url(${imgData})`;
        avatarSpiderIcon.style.display = 'none';
      } else {
        zenithAvatar.style.backgroundImage = '';
        avatarSpiderIcon.style.display = 'block';
      }
    }

    applyBackground(customBg);
    applyPfp(customPfp);

    bgBtn.onclick = () => bgPicker.click();
    bgPicker.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        customBg = reader.result;
        localStorage.setItem('zenith_bg', customBg);
        applyBackground(customBg);
        if (!customPfp) {
          localStorage.setItem('zenith_pfp', customBg);
          applyPfp(customBg);
        }
      };
      reader.readAsDataURL(file);
    };

    zenithAvatar.onclick = () => pfpPicker.click();
    pfpPicker.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        customPfp = reader.result;
        localStorage.setItem('zenith_pfp', customPfp);
        applyPfp(customPfp);
      };
      reader.readAsDataURL(file);
    };

    document.getElementById('resetBgBtn').onclick = () => {
      localStorage.removeItem('zenith_bg');
      localStorage.removeItem('zenith_pfp');
      customBg = '';
      customPfp = '';
      applyBackground('');
      applyPfp('');
      settingsPanel.classList.remove('open');
    };

    document.getElementById('clearChatBtn').onclick = () => {
      history = [];
      localStorage.removeItem('zenith_history');
      chat.innerHTML = '';
      settingsPanel.classList.remove('open');
    };

    function speakOutLoud(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const cleanText = normalizeForSpeech(text);
        if (!cleanText) return;
        const utterance = new SpeechSynthesisUtterance(cleanText);
        window.speechSynthesis.speak(utterance);
      }
    }

    speakSelectedBtn.onclick = () => {
      const selectedText = window.getSelection().toString().trim();
      if (selectedText) {
        speakOutLoud(selectedText);
      } else {
        alert("Please highlight/select some text on the screen first, then tap this option!");
      }
      settingsPanel.classList.remove('open');
    };

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      micBtn.onclick = () => {
        try {
          recognition.start();
          micBtn.classList.add('listening');
          input.placeholder = "Listening...";
        } catch (e) {
          recognition.stop();
        }
      };

      recognition.onresult = (event) => {
        const speechToText = event.results[0][0].transcript;
        input.value = speechToText;
        micBtn.classList.remove('listening');
        input.placeholder = "Type '/ff', 'wa: ...', or ask Zenith...";
        form.requestSubmit();
      };

      recognition.onerror = () => {
        micBtn.classList.remove('listening');
        input.placeholder = "Type '/ff', 'wa: ...', or ask Zenith...";
      };

      recognition.onend = () => {
        micBtn.classList.remove('listening');
        input.placeholder = "Type '/ff', 'wa: ...', or ask Zenith...";
      };
    } else {
      micBtn.style.display = 'none';
    }

    function renderMessage(html, sender) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerHTML = html;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    if (history.length === 0) {
      const welcome = "Zenith ready. Type `/ff` to launch Free Fire, `wa: [msg]` for WhatsApp, or ask a question!";
      history.push({ role: 'model', text: welcome, html: welcome });
    }
    history.forEach(item => renderMessage(item.html, item.role === 'user' ? 'user' : 'bot'));

    document.getElementById('settingsToggle').onclick = () => settingsPanel.classList.toggle('open');

    document.getElementById('saveKeyBtn').onclick = () => {
      apiKey = apiKeyInput.value.trim();
      localStorage.setItem('zenith_api_key', apiKey);
      settingsPanel.classList.remove('open');
    };

    document.getElementById('saveMemoryBtn').onclick = () => {
      savedMemory = memoryInput.value.trim();
      localStorage.setItem('zenith_memory', savedMemory);
      settingsPanel.classList.remove('open');
    };

    function buildContentsWithHistory(currentUserText) {
      const recentTurns = history
        .filter((item, idx) => !(idx === 0 && item.role === 'model' && item.text.startsWith('Zenith ready.')))
        .slice(-20)
        .map(item => ({
          role: item.role === 'user' ? 'user' : 'model',
          parts: [{ text: stripHtml(item.text) }]
        }))
        .filter(turn => turn.parts[0].text.length > 0);

      while (recentTurns.length > 0 && recentTurns[0].role !== 'user') {
        recentTurns.shift();
      }

      const lastTurn = recentTurns[recentTurns.length - 1];
      if (!lastTurn || lastTurn.role !== 'user' || lastTurn.parts[0].text !== currentUserText) {
        recentTurns.push({ role: 'user', parts: [{ text: currentUserText }] });
      }

      return recentTurns;
    }

    async function askZenith(userText) {
      const cmd = userText.trim().toLowerCase();

      if (cmd === '/ff' || cmd === 'free fire') {
        return `Launching Free Fire Max...<br><br><a class="action-link" href="intent://com.dts.freefiremax#Intent;scheme=android-app;package=com.dts.freefiremax;end" target="_blank">Open Free Fire Max ↗</a>`;
      }

      if (cmd.startsWith('wa:')) {
        const cleanMsg = userText.trim().slice(3).trim();
        const waUrl = `https://wa.me/?text=${encodeURIComponent(cleanMsg)}`;
        return `WhatsApp action ready:<br><br>"<i>${cleanMsg}</i>"<br><a class="action-link" href="${waUrl}" target="_blank">Send on WhatsApp ↗</a>`;
      }

      if (!apiKey) return "Please tap the `:` menu at the top right and paste your API key first!";

      try {
        const systemParts = [
          "You are Zenith, a helpful, direct AI assistant."
        ];
        if (savedMemory) {
          systemParts.push(`Persistent Memory:\n${savedMemory}`);
        }

        const bodyPayload = {
          systemInstruction: {
            parts: [{ text: systemParts.join('\n\n') }]
          },
          contents: buildContentsWithHistory(userText)
        };

        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent`,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-goog-api-key': apiKey
            },
            body: JSON.stringify(bodyPayload)
          }
        );
        const data = await response.json();
        if (data.error) return `API Error: ${data.error.message}`;
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response.";
        return reply.replace(/\n/g, '<br>');
      } catch (err) {
        return "Error connecting to Gemini API.";
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      renderMessage(text, 'user');
      history.push({ role: 'user', text: text, html: text });
      localStorage.setItem('zenith_history', JSON.stringify(history));
      input.value = '';

      const botHtml = await askZenith(text);
      const cleanBotText = stripHtml(botHtml);
      history.push({ role: 'model', text: cleanBotText, html: botHtml });
      localStorage.setItem('zenith_history', JSON.stringify(history));
      renderMessage(botHtml, 'bot');

      speakOutLoud(botHtml);
    });
  </script>
</body>
</html>
